[package]
name = "benchpod-desktop"
version = "0.0.0"
description = "BenchPod desktop app"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "benchpod_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
