# Go tests (the agent loop, the chat protocol, the policies, and the app's first run against the
# simulated pod and a scripted model), the webapp typecheck and benchpod-ui's tests. Needs no pod,
# no model and no key.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: benchpod-desktop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: embeddedci-com/benchpod-ui
          path: benchpod-ui
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchpod-desktop/go.mod
          cache-dependency-path: benchpod-desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The first-run test drives the real MCP server against the simulated pod (benchpod-sim).
      - name: Install the BenchPod MCP server
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp"
          "$RUNNER_TEMP/mcp/bin/pip" install --quiet embeddedci-mcp
          echo "BENCHPOD_MCP_COMMAND=$RUNNER_TEMP/mcp/bin/embeddedci-mcp" >> "$GITHUB_ENV"
      - run: make -C benchpod-desktop test
